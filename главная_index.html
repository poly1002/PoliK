<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Догоняй — Кабинет ученика</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #111827;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Мягкое синее свечение на фоне */
    .bg-glow {
      position: fixed;
      top: 15%;
      right: -10%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.12) 0%, rgba(248, 250, 252, 0) 70%);
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
    }

    /* Шапка сайта */
    header {
      max-width: 1140px;
      margin: 0 auto;
      padding: 24px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Логотип с анимированным синим огоньком */
    .logo {
      font-size: 23px;
      font-weight: 800;
      color: #111827;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      letter-spacing: -0.02em;
    }

    .logo-flame {
      display: inline-block;
      width: 18px;
      height: 22px;
      margin: 0 2px;
      transform-origin: bottom center;
      animation: flameFlicker 1.8s infinite alternate ease-in-out;
    }

    @keyframes flameFlicker {
      0% {
        transform: scale(1) rotate(-3deg);
        filter: drop-shadow(0 0 4px rgba(37, 99, 235, 0.4));
      }
      50% {
        transform: scale(1.08, 0.96) rotate(2deg);
        filter: drop-shadow(0 0 8px rgba(37, 99, 235, 0.7));
      }
      100% {
        transform: scale(0.97, 1.06) rotate(-2deg);
        filter: drop-shadow(0 0 5px rgba(37, 99, 235, 0.5));
      }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-badge {
      font-size: 14px;
      font-weight: 600;
      color: #4b5563;
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid #e5e7eb;
    }

    .btn-blue-pill {
      padding: 10px 24px;
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.2s, transform 0.2s;
      border: none;
      cursor: pointer;
    }

    .btn-blue-pill:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
    }

    /* Основной контейнер */
    .container {
      max-width: 1040px;
      margin: 30px auto 60px;
      padding: 0 20px;
    }

    /* Заголовок блока */
    .hero-header {
      text-align: center;
      margin-bottom: 45px;
      animation: fadeInUp 0.6s ease-out;
    }

    .hero-header h1 {
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 800;
      color: #111827;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .hero-header h1 span {
      color: #2563eb;
    }

    .hero-header p {
      font-size: 16px;
      color: #6b7280;
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* Сетка карточек предметов */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 24px;
    }

    .subject-card {
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
      animation: fadeInUp 0.6s ease-out backwards;
    }

    .subject-card:nth-child(1) { animation-delay: 0.1s; }
    .subject-card:nth-child(2) { animation-delay: 0.2s; }
    .subject-card:nth-child(3) { animation-delay: 0.3s; }
    .subject-card:nth-child(4) { animation-delay: 0.4s; }

    .subject-card:hover {
      border-color: #2563eb;
      transform: translateY(-5px);
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.1);
    }

    .subject-card.active {
      border-color: #2563eb;
      background-color: #eff6ff;
    }

    .icon-box {
      width: 56px;
      height: 56px;
      background-color: #eff6ff;
      color: #2563eb;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 20px;
      transition: transform 0.2s;
    }

    .subject-card:hover .icon-box {
      transform: scale(1.1);
    }

    .subject-card h3 {
      font-size: 19px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 10px;
    }

    .subject-card p {
      font-size: 14px;
      color: #6b7280;
      line-height: 1.5;
    }

    /* Блок с лайфхаками */
    .lifehacks-panel {
      margin-top: 36px;
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.04);
      display: none;
      animation: fadeInUp 0.4s ease-out;
    }

    .lifehacks-panel h2 {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 20px;
    }

    .lifehacks-panel h2 span {
      color: #2563eb;
    }

    .hack-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 14px;
      font-size: 15px;
      line-height: 1.5;
      color: #334155;
    }

    .hack-card strong {
      color: #2563eb;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 16px;
      }
      .user-badge {
        display: none;
      }
      .lifehacks-panel {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- Шапка с твоим анимированным синим огоньком -->
  <header>
    <a href="index.html" class="logo">
      Д<svg class="logo-flame" viewBox="0 0 24 28" fill="none" xmlns="http://w3.org">
        <path d="M12.5 1C12.5 1 19 6.5 19 13.5C19 18.5 15.8 22 12 22C8.2 22 5 18.5 5 13.5C5 10.5 6.8 7.5 8.5 6C8.5 6 8.2 9.5 10.5 10.5C10.5 10.5 9.5 5.5 12.5 1Z" fill="#2563eb"/>
        <path d="M12 11C12 11 15 13.5 15 16.5C15 18.5 13.7 20 12 20C10.3 20 9 18.5 9 16.5C9 14.5 10.5 12.5 12 11Z" fill="#93c5fd"/>
      </svg>гоняй
    </a>
    <div class="header-actions">
      <div class="user-badge" id="userNameBadge">Кабинет ученика</div>
      <a href="index4.html" class="btn-blue-pill">Выйти</a>
    </div>
  </header>

  

</body>
</html>
