<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Создание аккаунта — Догоняй репетитор 🔥</title>
  <style>
    /* Наш фирменный премиальный стиль */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      overflow-x: hidden;
    }

    /* Матовая фиксированная шапка */
    .header {
      background-color: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(59, 130, 246, 0.12);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 75px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .logo-text {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.8px;
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .logo-fire-svg {
      width: 21px;
      height: 25px;
      margin: 0 1px 0 2px;
      filter: drop-shadow(0 2px 6px rgba(59, 130, 246, 0.25));
    }

    .spacer { height: 75px; }

    /* КОНТЕЙНЕР ДЛЯ РЕГИСТРАЦИИ */
    .auth-section {
      min-height: calc(100vh - 75px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .auth-card {
      background-color: #ffffff;
      width: 100%;
      max-width: 450px;
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(59, 130, 246, 0.04);
      border: 1px solid rgba(59, 130, 246, 0.08);
    }

    .auth-title {
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .auth-title span {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-desc {
      font-size: 14px;
      color: #475569;
      margin-bottom: 30px;
      text-align: center;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }

    /* Красивые инпуты ввода */
    .form-input {
      width: 100%;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      color: #0f172a;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: #3b82f6;
    }

    /* Синяя переливающаяся кнопка отправки */
    .btn-auth {
      width: 100%;
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.2);
    }

    .btn-auth:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
    }
     .auth-footer {
      margin-top: 20px;
      font-size: 14px;
      color: #475569;
      text-align: center;
    }

    .auth-link {
      color: #3b82f6;
      text-decoration: none;
      font-weight: 700;
    }

    .auth-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Наша фирменная матовая шапка -->
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo-container">
        <span class="logo-text">Д</span>
        <svg class="logo-fire-svg" viewBox="0 0 24 24" width="21" height="25">
          <defs>
            <linearGradient id="blue-fire-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#1e40af" />
              <stop offset="100%" stop-color="#3b82f6" />
            </linearGradient>
          </defs>

        </svg>
        <span class="logo-text">гоняй репетитор</span>
      </a>
    </div>
  </header>

  <div class="spacer"></div>

  <!-- Карточка регистрации -->
  <section class="auth-section">
    <div class="auth-card">
      <h2 class="auth-title">Создание <span>профиля</span></h2>
      <p class="auth-desc">Зарегистрируйтесь, чтобы сохранить свой личный трек обучения</p>
<form action="index1.html">
  
  <!-- Поле: Имя -->
  <div class="form-group">
    <label class="form-label">Имя  </label>
    <input type="text" class="form-input" id="userName" placeholder="Введите ваше имя " required>

  <!-- Поле: Пароль -->
  <div class="form-group">
    <label class="form-label">Пароль</label>
    <input type="password" class="form-input" id="userPassword" placeholder="Минимум 6 символов" required>
  </div>

  <!-- Кнопка -->
  <button type="submit" class="btn-auth">Создать аккаунт</button>

</form>

      <div class="auth-footer">
        Уже есть аккаунт? <a href="index4.html" class="auth-link">Войти</a>
      </div>
    </div>
  </section>

</body>
</html>
